name: Cross-Platform Release & Installers

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]*"
      - "[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Build profile for manual dispatch ('release' installers or 'dev' debug bundles)"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - dev

permissions:
  contents: write

jobs:
  verify:
    name: Verify TypeScript & Static Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Verify TypeScript compilation
        run: npm run typecheck

      - name: Verify static Next.js Tauri export
        run: npm run build:tauri-web

  prepare-release:
    name: Create GitHub Release (${{ github.ref_name }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Release exists for tag
        id: ensure_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE_EOF'
          const fs = require("node:fs");

          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.GITHUB_REF_NAME;
            const sha = process.env.GITHUB_SHA;
            const token = process.env.GH_TOKEN;
            const releaseTitle = `Nano Banana Goal Harness & Studio ${tag}`;
            const prerelease = tag.includes("-");
            const body = [
              `## Nano Banana Goal Harness & Atelier Studio — \`${tag}\``,
              "",
              "Autonomous Multi-Agent Goal-Driven Image Evolution Harness (**AutoRef-Harness + EvoGen TRACE**) & 2×2 Interactive Studio for **Google Nano Banana (`gemini-2.5-flash-image` & `gemini-3-pro-image-preview`)**.",
              "",
              "### 📦 Native Desktop Installers",
              "- **Windows 64-bit (`x64`)**: `*_x64-setup.exe` (NSIS) & `*_x64_en-US.msi` (WiX)",
              "- **Windows 32-bit (`x86`)**: `*_x86-setup.exe` (NSIS) & `*_x86_en-US.msi` (WiX)",
              "- **Linux (`x64`)**: `*.deb` (Debian / Ubuntu), `*.AppImage` (Portable AppImage), & `*.rpm` (Fedora / RHEL)",
              "- **macOS (`Apple Silicon arm64` & `Intel x64`)**: `*_aarch64.dmg` & `*_x64.dmg`",
              `- **Static Web Export**: \`nanobanana-studio-web-${tag}.tar.gz\``,
            ].join("\n");

            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
            };

            const listRes = await fetch(
              `https://api.github.com/repos/${repo}/releases?per_page=100`,
              { headers }
            );
            if (!listRes.ok) {
              throw new Error(
                `Failed to list releases (${listRes.status}): ${await listRes.text()}`
              );
            }
            const releases = await listRes.json();
            const existing = releases.find(
              (r) => r.tag_name === tag || (r.draft && r.name === releaseTitle)
            );

            const payload = {
              tag_name: tag,
              target_commitish: sha,
              name: releaseTitle,
              body,
              draft: false,
              prerelease,
            };

            const url = existing
              ? `https://api.github.com/repos/${repo}/releases/${existing.id}`
              : `https://api.github.com/repos/${repo}/releases`;
            const method = existing ? "PATCH" : "POST";

            console.log(`${method} release for tag=${tag} (existing=${existing?.id ?? "none"})`);
            const saveRes = await fetch(url, {
              method,
              headers,
              body: JSON.stringify(payload),
            });
            if (!saveRes.ok) {
              throw new Error(
                `Failed to ${method} release (${saveRes.status}): ${await saveRes.text()}`
              );
            }
            const saved = await saveRes.json();
            console.log(`Published release id=${saved.id} html_url=${saved.html_url}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${saved.id}\n`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE_EOF

  build-installers:
    name: Build ${{ matrix.label }}
    needs:
      - verify
      - prepare-release
    if: always() && needs.verify.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64: .deb, .AppImage, .rpm
          - label: "Linux x64 (.deb, .AppImage, .rpm)"
            artifact_slug: "linux-x64"
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage"

          # Windows 64-bit: x64 .exe (NSIS) & .msi (WiX)
          - label: "Windows x64 (.exe & .msi)"
            artifact_slug: "windows-x64"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"

          # Windows 32-bit: x86 .exe (NSIS) & .msi (WiX)
          - label: "Windows x86 32-bit (.exe & .msi)"
            artifact_slug: "windows-x86"
            os: windows-latest
            target: i686-pc-windows-msvc
            args: "--target i686-pc-windows-msvc --bundles nsis,msi"

          # macOS Apple Silicon: arm64 .dmg
          - label: "macOS Apple Silicon (arm64 .dmg)"
            artifact_slug: "macos-arm64"
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"

          # macOS Intel: x64 .dmg
          - label: "macOS Intel (x64 .dmg)"
            artifact_slug: "macos-x64"
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies (WebKit2GTK 4.1, AppImage FUSE, RPM)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            rpm

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust stable toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install NPM dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Sync version from Git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_VERSION="${RAW_TAG#v}"
          if [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VERSION="${CLEAN_VERSION}.0"
          elif [[ "$CLEAN_VERSION" =~ ^([0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)$ ]]; then
            CLEAN_VERSION="${BASH_REMATCH[1]}.0${BASH_REMATCH[2]}"
          fi
          if [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Syncing release version to ${CLEAN_VERSION}"
            node -e '
              const fs = require("fs");
              const ver = process.argv[1];
              for (const file of ["package.json", "frontend/package.json", "src-tauri/tauri.conf.json"]) {
                const data = JSON.parse(fs.readFileSync(file, "utf8"));
                data.version = ver;
                fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
              }
              const cargoPath = "src-tauri/Cargo.toml";
              const cargo = fs.readFileSync(cargoPath, "utf8").replace(
                /^version\s*=\s*"[^"]*"/m,
                `version = "${ver}"`
              );
              fs.writeFileSync(cargoPath, cargo);
            ' "$CLEAN_VERSION"
          else
            echo "Tag '${RAW_TAG}' is not strict semver; keeping manifest version."
          fi

      # 1. Tag Push -> Build & Upload Installers to Pre-Created GitHub Release
      - name: Build & Publish Tauri Release Installers (Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }}

      # 2. Manual Dispatch -> Build Release or Dev/Debug Installers & Upload Workflow Artifacts
      - name: Build Tauri Bundles (Manual Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          if [ "${{ inputs.build_profile }}" = "dev" ]; then
            npx tauri build --debug ${{ matrix.args }}
          else
            npx tauri build ${{ matrix.args }}
          fi

      - name: Upload Built Installer Artifacts (Manual Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nanobanana-${{ inputs.build_profile || 'release' }}-${{ matrix.artifact_slug }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/debug/bundle/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Package & Upload Static Web Bundle (Linux Tag Push)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf "nanobanana-studio-web-${GITHUB_REF_NAME}.tar.gz" -C frontend/out .
          for attempt in 1 2 3 4 5; do
            if gh release upload "${GITHUB_REF_NAME}" "nanobanana-studio-web-${GITHUB_REF_NAME}.tar.gz" --clobber; then
              exit 0
            fi
            sleep 3
          done
          exit 1
