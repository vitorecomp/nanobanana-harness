name: CI & Dev Verification

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frontend:
    name: Frontend Typecheck & Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Verify TypeScript compilation
        run: npm run typecheck

      - name: Build static Tauri frontend export
        run: npm run build:tauri-web

      - name: Upload static web dev bundle
        uses: actions/upload-artifact@v4
        with:
          name: nanobanana-web-static-dev
          path: frontend/out
          retention-days: 7

  verify-tauri-rust:
    name: Rust Core & SQLite Check (Tauri v2)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system headers (WebKit2GTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Tauri Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
