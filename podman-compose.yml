# ==============================================================================
# Nano Banana Studio — Production Podman Compose Stack (podman-compose.yml)
# ==============================================================================
# Universal Port Pad (`PORT_PAD`):
#   podman-compose -f podman-compose.yml up -d            -> 8080, 3000, 8000, 5432, 9000, 9001
#   PORT_PAD=1 podman-compose -f podman-compose.yml up -d -> 18080, 13000, 18000, 15432, 19000, 19001
#   PORT_PAD=2 podman-compose -f podman-compose.yml up -d -> 28080, 23000, 28000, 25432, 29000, 29001
#
# Uses production multi-stage builds (Gunicorn for Flask + SQLAlchemy backend,
# optimized Next.js production build for frontend), restart: unless-stopped,
# and REQUIRE_AUTH=true.
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: nanobanana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nanobanana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanobanana}
      POSTGRES_DB: ${POSTGRES_DB:-nanobanana}
    ports:
      - "${PORT_PAD:-}5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-nanobanana} -d ${POSTGRES_DB:-nanobanana}"
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: nanobanana-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${PORT_PAD:-}9000:9000"
      - "${PORT_PAD:-}9001:9001"
    volumes:
      - rustfs_data:/data

  backend:
    build:
      context: ./backend
      target: production
    container_name: nanobanana-backend
    restart: unless-stopped
    environment:
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nanobanana}:${POSTGRES_PASSWORD:-nanobanana}@postgres:5432/${POSTGRES_DB:-nanobanana}
      BUCKET_PROVIDER: rustfs
      BUCKET_ENDPOINT_URL: http://rustfs:9000
      BUCKET_PUBLIC_URL: http://localhost:${PORT_PAD:-}9000
      BUCKET_NAME: ${BUCKET_NAME:-nanobanana-images}
      BUCKET_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      BUCKET_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
    command: ["sh", "-c", "alembic upgrade head && gunicorn --bind 0.0.0.0:8000 --workers 2 wsgi:app"]
    ports:
      - "${PORT_PAD:-}8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: nanobanana-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-}
      NEXT_PUBLIC_REQUIRE_AUTH: ${NEXT_PUBLIC_REQUIRE_AUTH:-true}
    ports:
      - "${PORT_PAD:-}3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nanobanana-nginx
    restart: unless-stopped
    ports:
      - "${PORT_PAD:-}8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - rustfs

volumes:
  postgres_data:
  rustfs_data:
