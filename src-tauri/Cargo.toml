[package]
name = "nanobanana-studio"
version = "1.0.0"
description = "Nano Banana Interactive Studio — Installable Desktop App powered by Tauri v2, React 19, Local SQLite & Native Filesystem"
authors = ["Nano Banana Studio Contributors"]
license = "MIT"
repository = "https://github.com/google-gemini/nanobanana-inspiration"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanobanana_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
