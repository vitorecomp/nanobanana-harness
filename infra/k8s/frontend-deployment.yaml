apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobanana-frontend
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nanobanana
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobanana-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobanana-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: nanobanana
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nanobanana/nanobanana-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: nanobanana-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nanobanana-frontend
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nanobanana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanobanana-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
