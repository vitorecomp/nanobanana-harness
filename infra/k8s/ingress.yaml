apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanobanana-ingress
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-ingress
    app.kubernetes.io/part-of: nanobanana
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: nanobanana.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nanobanana-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nanobanana-frontend
                port:
                  number: 3000
