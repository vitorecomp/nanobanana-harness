apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nanobanana-backend-hpa
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-backend-hpa
    app.kubernetes.io/part-of: nanobanana
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nanobanana-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nanobanana-frontend-hpa
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-frontend-hpa
    app.kubernetes.io/part-of: nanobanana
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nanobanana-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
