apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobanana-nginx
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-nginx
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: nanobanana
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nanobanana-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanobanana-nginx
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: nanobanana
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: nanobanana-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nanobanana-gateway
  namespace: nanobanana
  labels:
    app.kubernetes.io/name: nanobanana-nginx
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: nanobanana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanobanana-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
