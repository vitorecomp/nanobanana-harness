# ==============================================================================
# Nano Banana Studio — Development Podman Compose Stack (podman-compose.dev.yml)
# ==============================================================================
# Universal Port Pad (`PORT_PAD`):
#   PORT_PAD=1 podman-compose -f podman-compose.dev.yml up -d  -> 18080, 13000, 18000, 15432, 19000, 19001
#   PORT_PAD=2 podman-compose -f podman-compose.dev.yml up -d  -> 28080, 23000, 28000, 25432, 29000, 29001
#
# Uses development multi-stage targets (Flask --reload for backend, Next.js HMR
# for frontend), source bind mounts, and REQUIRE_AUTH=false (no mandatory login
# in local dev — auto-provisions usr_local_dev).
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: nanobanana-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nanobanana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanobanana}
      POSTGRES_DB: ${POSTGRES_DB:-nanobanana}
    ports:
      - "${PORT_PAD:-}5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-nanobanana} -d ${POSTGRES_DB:-nanobanana}"
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: nanobanana-rustfs-dev
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${PORT_PAD:-}9000:9000"
      - "${PORT_PAD:-}9001:9001"
    volumes:
      - rustfs_dev_data:/data

  backend:
    build:
      context: ./backend
      target: development
    container_name: nanobanana-backend-dev
    environment:
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nanobanana}:${POSTGRES_PASSWORD:-nanobanana}@postgres:5432/${POSTGRES_DB:-nanobanana}
      BUCKET_PROVIDER: rustfs
      BUCKET_ENDPOINT_URL: http://rustfs:9000
      BUCKET_PUBLIC_URL: http://localhost:${PORT_PAD:-}9000
      BUCKET_NAME: ${BUCKET_NAME:-nanobanana-images}
      BUCKET_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      BUCKET_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
    command: ["sh", "-c", "alembic upgrade head && flask --app wsgi:app run --host=0.0.0.0 --port=8000 --reload"]
    volumes:
      - ./backend:/app
    ports:
      - "${PORT_PAD:-}8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: nanobanana-frontend-dev
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-}
      NEXT_PUBLIC_REQUIRE_AUTH: ${NEXT_PUBLIC_REQUIRE_AUTH:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${PORT_PAD:-}3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: nanobanana-nginx-dev
    ports:
      - "${PORT_PAD:-}8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - rustfs

volumes:
  postgres_dev_data:
  rustfs_dev_data:
